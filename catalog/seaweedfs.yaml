apiVersion: v1
kind: Namespace
metadata:
  labels:
    manage-oci-credential: enabled
  name: seaweedfs
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    manage-oci-credential: enabled
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 4.51.0
  url: oci://${GHCR_REGISTRY_MIRROR:=ghcr.io}/seaweedfs/seaweedfs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  chartRef:
    kind: OCIRepository
    name: seaweedfs
    namespace: seaweedfs
  interval: 1h
  values:
    filer:
      data:
        size: 10Gi
        type: persistentVolumeClaim
      logs:
        size: 10Gi
        type: persistentVolumeClaim
      s3:
        enableAuth: true
        enabled: true
    global:
      seaweedfs:
        monitoring:
          enabled: true
    master:
      data:
        size: 10Gi
        type: persistentVolumeClaim
      logs:
        size: 10Gi
        type: persistentVolumeClaim
    volume:
      dataDirs:
        - maxVolumes: 0
          name: data1
          size: 50Gi
          type: persistentVolumeClaim
