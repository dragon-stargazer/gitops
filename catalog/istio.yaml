apiVersion: v1
kind: Namespace
metadata:
  labels:
    manage-oci-credential: enabled
  name: istio-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    manage-oci-credential: enabled
  name: istio-base
  namespace: istio-system
spec:
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.31.3
  url: oci://${GHCR_REGISTRY_MIRROR:=ghcr.io}/istio/release/charts/base
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  chartRef:
    kind: OCIRepository
    name: istio-base
    namespace: istio-system
  interval: 1h
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    manage-oci-credential: enabled
  name: istiod
  namespace: istio-system
spec:
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.31.3
  url: oci://${GHCR_REGISTRY_MIRROR:=ghcr.io}/istio/release/charts/istiod
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  chartRef:
    kind: OCIRepository
    name: istiod
    namespace: istio-system
  dependsOn:
    - name: istio-base
  interval: 1h
  values:
    global:
      proxy:
        clusterDomain: ${CLUSTER_DOMAIN:=cluster.local}
    meshConfig:
      defaultConfig:
        proxyMetadata:
          ISTIO_DUAL_STACK: "true"
      trustDomain: ${CLUSTER_DOMAIN:=cluster.local}
    pilot:
      autoscaleEnabled: false
      env:
        ISTIO_DUAL_STACK: "true"
    profile: ambient
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    manage-oci-credential: enabled
  name: istio-cni
  namespace: istio-system
spec:
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.31.3
  url: oci://${GHCR_REGISTRY_MIRROR:=ghcr.io}/istio/release/charts/cni
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  chartRef:
    kind: OCIRepository
    name: istio-cni
    namespace: istio-system
  dependsOn:
    - name: istiod
  interval: 1h
  values:
    profile: ambient
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    manage-oci-credential: enabled
  name: ztunnel
  namespace: istio-system
spec:
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.31.3
  url: oci://${GHCR_REGISTRY_MIRROR:=ghcr.io}/istio/release/charts/ztunnel
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  chartRef:
    kind: OCIRepository
    name: ztunnel
    namespace: istio-system
  dependsOn:
    - name: istiod
  interval: 1h
