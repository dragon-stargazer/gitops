apiVersion: v1
kind: Namespace
metadata:
  labels:
    manage-oci-credential: enabled
  name: dex
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    manage-oci-credential: enabled
  name: dex
  namespace: dex
spec:
  interval: 24h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.26.0
  url: oci://${GHCR_REGISTRY_MIRROR:=ghcr.io}/dexidp/helm-charts/dex
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: dex
spec:
  chartRef:
    kind: OCIRepository
    name: dex
    namespace: dex
  interval: 1h
  values:
    serviceMonitor:
      enabled: ${ENABLE_SERVICE_MONITOR:=true}
